<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Табло - VASKO (VASK)</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131d31;
            --border-color: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .navbar h1 {
            font-size: 20px;
            color: var(--accent-blue);
            margin: 0;
            font-weight: 700;
        }
        .logout-btn {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background-color: var(--danger);
            color: white;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .welcome-banner {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .welcome-banner h2 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: #ffffff;
        }
        .welcome-banner p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .card h3 {
            margin-top: 0;
            color: var(--accent-blue);
            font-size: 16px;
            margin-bottom: 15px;
        }
        .balance-value {
            font-size: 34px;
            font-weight: 800;
            color: var(--accent-green);
            letter-spacing: -1px;
        }
        .key-box {
            background-color: #0b0f19;
            border: 1px dashed var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            color: #f43f5e;
            letter-spacing: 2px;
            display: block;
            text-align: center;
            margin-top: 10px;
            word-break: break-all;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
        .stat-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }
        .stat-value {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 5px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        .btn {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .action-grid {
                grid-template-columns: 1fr;
            }
        }

            align-items: center;
            gap: 8px;

            color: white;
            text-decoration: none;
