<!DOCTYPE html>
<html lang="bg">
<head>
    <title>{{ coin_name }} Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body style="font-family:sans-serif; padding: 20px;">
    <h1>Добре дошли, {{ username }}!</h1>
    <p>Баланс: <b id="balance">{{ balance }}</b> {{ symbol }}</p>
    <p>Вашият миньорски ключ: <code>{{ mining_key }}</code></p>
    {% if role == 'admin' %}
        <div style="background:#eee; padding:10px; margin-bottom:10px;">
            <h3>Админ панел</h3>
            <input type="text" id="targetUser" placeholder="Потребител">
            <input type="number" id="transferAmount" placeholder="Сума">
            <button onclick="adminTransfer()">Преведи VASK</button>
        </div>
    {% endif %}
    
    <hr>
    <h3>Уеб Миньор (PoUW)</h3>
    <p>Трудност: {{ difficulty }}</p>
    <label>Интензитет на CPU: <span id="cpuVal">50</span>%</label><br>
    <input type="range" id="cpuSlider" min="10" max="100" value="50" oninput="document.getElementById('cpuVal').innerText=this.value"><br><br>
    <button onclick="toggleMining()" id="mineBtn">Старт на миньора</button>
    <p id="miningStatus">Статус: Спрян</p>

    <br><a href="/logout">Изход</a>

    <script>
        let mining = false;
        let username = "{{ username }}";
        let miningKey = "{{ mining_key }}";

        function toggleMining() {
            mining = !mining;
            document.getElementById("mineBtn").innerText = mining ? "Спри миньора" : "Старт на миньора";
            document.getElementById("miningStatus").innerText = mining ? "Статус: Копае..." : "Статус: Спрян";
            if (mining) mineLoop();
        }

        async function mineLoop() {
            while (mining) {
                let res = await fetch('/get_job');
                let data = await res.json();
                let target = data.target;
                let difficulty = data.difficulty;

                let nonce = 0;
                let hash = "";

                let intensity = document.getElementById("cpuSlider").value;
                let maxIterations = intensity * 50;

                for (let i = 0; i < maxIterations; i++) {
                    nonce = Math.floor(Math.random() * 10000000);
                    let combined = target + nonce;
                    hash = CryptoJS.SHA256(combined).toString();
                    if (hash.startsWith(difficulty)) {
                        let subRes = await fetch('/submit_block', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({username, mining_key: miningKey, nonce, target})
                        });
                        let subData = await subRes.json();
                        alert(subData.message);
                        location.reload();
                        return;
                    }
                }
                let sleepTime = 101 - intensity;
                await new Promise(r => setTimeout(r, sleepTime));
            }
        }

        async function adminTransfer() {
            let targetUser = document.getElementById("targetUser").value;
            let amount = document.getElementById("transferAmount").value;
            let res = await fetch('/admin/transfer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({target_user: targetUser, amount})
            });
            let data = await res.json();
            alert(data.message);
            location.reload();
        }
    </script>
</body>
</html>
