<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Частен Лог на Транзакциите - Админ</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: monospace;
            padding: 20px;
        }
        h2 { color: #f59e0b; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #131d31;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #1e293b;
        }
        th { background-color: #1e293b; color: #38bdf8; }
        .back-btn {
            display: inline-block;
            color: #38bdf8;
            text-decoration: none;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <a href="/dashboard" class="back-btn">← Назад към Таблото</a>
    <h2>🔒 Частен регистър на всички транзакции (Admin Only)</h2>
    
    <table>
        <thead>
            <tr>
                <th>Изпращач</th>
                <th>Получател</th>
                <th>Сума ({{ symbol }})</th>
                <th>Тип</th>
            </tr>
        </thead>
        <tbody>
            {% for tx in txs %}
            <tr>
                <td>{{ tx.sender }}</td>
                <td style="color: #10b981;">{{ tx.receiver }}</td>
                <td>{{ "%.5f"|format(tx.amount) }}</td>
                <td style="color: #f59e0b;">{{ tx.type }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
