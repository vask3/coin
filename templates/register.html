<!DOCTYPE html>
<html lang="bg">
<head><title>Регистрация - VASKO</title></head>
<body style="font-family:sans-serif; text-align:center; padding-top:50px;">
    <h2>Регистрация в VASKO</h2>
    <p style="color:green;">Получавате <b>5 VASK</b> бонус при регистрация!</p>
    {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
    <form method="POST">
        <input type="text" name="username" placeholder="Потребителско име" required><br><br>
        <input type="email" name="email" placeholder="Имейл адрес" required><br><br>
        <input type="password" name="password" placeholder="Парола" required><br><br>
        <button type="submit">Регистрация</button>
    </form>
    <p>Вече имате акаунт? <a href="/login">Вход</a></p>
</body>
</html>
