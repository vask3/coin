<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - VASKO Ecosystem</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131d31;
            --border-color: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --danger: #ef4444;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .card {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; box-sizing: border-box;
        }
        h2 { margin-top: 0; color: var(--accent-blue); font-size: 22px; text-align: center; margin-bottom: 20px; }
        .form-control {
            width: 100%; padding: 12px; background-color: #0b0f19; border: 1px solid var(--border-color);
            border-radius: 8px; color: white; font-size: 14px; margin-bottom: 15px; box-sizing: border-box;
        }
        .btn {
            background-color: var(--accent-green); color: white; border: none; padding: 12px;
            border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 15px;
        }
        .error { background-color: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; text-align: center; }
        .footer-link { text-align: center; margin-top: 15px; font-size: 13px; color: var(--text-muted); }
        .footer-link a { color: var(--accent-blue); text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🚀 Register Node</h2>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/register" method="POST">
            <input type="text" name="username" class="form-control" placeholder="Choose Username" required>
            <input type="email" name="email" class="form-control" placeholder="Email (Optional)">
            <input type="password" name="password" class="form-control" placeholder="Choose Password" required>
            <button type="submit" class="btn">Register & Get 5 VASK</button>
        </form>

        <div class="footer-link">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>

</body>
</html>
