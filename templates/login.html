<!DOCTYPE html>
<html lang="bg">
<head><title>Вход - VASKO</title></head>
<body style="font-family:sans-serif; text-align:center; padding-top:50px;">
    <h2>Вход в VASKO Network</h2>
    {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
    <form method="POST">
        <input type="text" name="username" placeholder="Потребителско име" required><br><br>
        <input type="password" name="password" placeholder="Парола" required><br><br>
        <button type="submit">Вход</button>
    </form>
    <p>Нямате акаунт? <a href="/register">Регистрация (Бонус 5 VASK)</a></p>
</body>
</html>
