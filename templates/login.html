<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Вход - VASKO Coin</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 50px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; display: inline-block; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #00ffcc; }
        input, button { padding: 12px; margin: 10px 0; width: 90%; border-radius: 6px; border: none; font-size: 15px; }
        button { background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; }
        a { color: #00ffcc; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔑 Вход (VASK)</h1>
        {% if error %}<p style="color: #ff4444;">{{ error }}</p>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Потребителско име" required><br>
            <input type="password" name="password" placeholder="Парола" required><br>
            <button type="submit">Влез</button>
        </form>
        <p>Нямаш профил? <a href="/register">Регистрирай се</a></p>
    </div>
</body>
</html>
