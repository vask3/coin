<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VASKO Web Miner</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 30px; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; display: inline-block; width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: left; }
        input { padding: 10px; margin: 8px 0; width: 92%; border-radius: 6px; border: none; font-size: 14px; background: #2a2a2a; color: #fff; }
        button { padding: 12px; width: 100%; background: #00ffcc; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .stop-btn { background: #ff4444 !important; color: #fff !important; }
        .stat { font-size: 14px; margin: 10px 0; background: #2a2a2a; padding: 8px 12px; border-radius: 6px; word-break: break-all; }
        h1 { color: #00ffcc; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h1>⛏️ Web Miner</h1>
        <label>Username:</label>
        <input type="text" id="username" placeholder="Enter your username">
        
        <label>6-Character Mining Key:</label>
        <input type="text" id="miningKey" placeholder="e.g. A7X9K2" maxlength="6" style="text-transform: uppercase;">
        
        <button id="toggleBtn" onclick="toggleMining()">Start Mining</button>
        
        <div style="margin-top: 20px;">
            <div class="stat">Status: <span id="status" style="color: #ffcc00;">Stopped</span></div>
            <div class="stat">Blocks Mined (Session): <span id="blocksCount" style="color: #00ffcc;">0</span></div>
            <div class="stat">Hashrate (H/s): <span id="hashRate">0</span></div>
        </div>
        <p id="log" style="font-size: 12px; color: #aaa; margin-top: 15px; word-break: break-all;"></p>
    </div>

    <script>
        let mining = false;
        let blocksMined = 0;
        let hashesTotal = 0;

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function toggleMining() {
            const btn = document.getElementById('toggleBtn');
            if (!mining) {
                const username = document.getElementById('username').value.trim();
                const miningKey = document.getElementById('miningKey').value.trim().toUpperCase();
                if (!username || miningKey.length !== 6) {
                    alert("Please enter a username and a valid 6-character mining key!");
                    return;
                }
                mining = true;
                btn.innerText = "Stop Mining";
                btn.className = "stop-btn";
                document.getElementById('status').innerText = "Mining active...";
                
                startMiningLoop(username, miningKey);
            } else {
                mining = false;
                btn.innerText = "Start Mining";
                btn.className = "";
                document.getElementById('status').innerText = "Stopped";
            }
        }

        async function startMiningLoop(username, miningKey) {
            let startTime = Date.now();
            
            while (mining) {
                try {
                    let res = await fetch('/get_job');
                    let job = await res.json();
                    let target = job.target;
                    let difficulty = job.difficulty;

                    document.getElementById('log').innerText = `Got job. Searching for difficulty: ${difficulty}...`;

                    let nonce = 0;
                    let found = false;

                    while (mining && nonce < 50000) {
                        nonce++;
                        hashesTotal++;
                        
                        let combined = target + nonce;
                        let hash = await sha256(combined);

                        if (hash.startsWith(difficulty)) {
                            found = true;
                            document.getElementById('log').innerText = `Block found! Submitting to cloud...`;
                            
                            let subRes = await fetch('/submit_block', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    username: username,
                                    mining_key: miningKey,
                                    nonce: nonce,
                                    target: target
                                })
                            });

                            let subData = await subRes.json();
                            if (subRes.ok) {
                                blocksMined++;
                                document.getElementById('blocksCount').innerText = blocksMined;
                                document.getElementById('log').innerText = subData.message;
                            } else {
                                document.getElementById('log').innerText = "Error: " + subData.message;
                                if(subRes.status === 401 || subRes.status === 429) {
                                    toggleMining();
                                    alert(subData.message);
                                    return;
                                }
                            }
                            break;
                        }
                    }

                    let elapsed = (Date.now() - startTime) / 1000;
                    if(elapsed > 0) {
                        document.getElementById('hashRate').innerText = Math.round(hashesTotal / elapsed);
                    }

                } catch (e) {
                    document.getElementById('log').innerText = "Network error: " + e.message;
                    await new Promise(r => setTimeout(r, 3000));
                }
            }
        }
    </script>
</body>
</html>
